<body>
	<button type="button" id="myButton">Click Me</button>
	<button type="button" id="myButtonJSON">Click Me (JSON)</button>
	<div id="message" class="message">Click the button to get a message</div>
	<div id="loader" class="loader" hidden>Loading...</div>
	<script>
		(() => {
			async function handleClick(askForJson) {
				const script = 'FM Script';
				const param = askForJson ? "DEAR FM, PLEASE SEND JSON!" : `HELLO FROM JS ${new Date()}`;
				const timeout = 1000;
				const timeoutMessage = `Custom timeout message. The webviewer code elected to only wait for ${timeout}ms.`;
				updateMessage('Waiting...');
				showLoader();
				try {
					if (askForJson) {
						// .json() parses FM's result, which FM always returns as text
						const res = await FMGofer.PerformScript(script, param, timeout, timeoutMessage).json();
						updateMessage(JSON.stringify(res, null, 2), '😍');
					} else {
						const res = await FMGofer.PerformScriptWithOption(script, param, Option.Default, timeout, timeoutMessage);
						updateMessage(res, '😍');
					}
				} catch (error) {
					updateMessage(error, '😵');
				} finally {
					hideLoader();
				}
			}
			function showLoader() {
				document.getElementById('loader').hidden = false;
			}
			function hideLoader() {
				document.getElementById('loader').hidden = true;
			}
			function updateMessage(message, emoji) {
				let html = message;
				if (emoji) {
					html += `<div style="font-size: 4rem;">${emoji}</div>`;
				}
				document.getElementById('message').innerHTML = html;
			}

			document.getElementById('myButtonJSON').onclick = () => handleClick(true);
			document.getElementById('myButton').onclick = () => handleClick(false);
		})();
	</script>
</body>
